<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reservas Navidad · Picabú</title>
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
  :root{--cafe:#5a3e36;--crema:#fbf6ef;--beige:#efe4d6;--linea:#e4d6c5;--texto:#3b2a25;--suave:#8a7468;--ok:#6f8f72;--pend:#c08a4e;--rojo:#a8504a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--crema);color:var(--texto);font-family:Montserrat,sans-serif;font-size:15px}
  header{background:var(--cafe);color:var(--crema);padding:22px 16px 0;position:sticky;top:0;z-index:5}
  h1{font-family:'Yeseva One',serif;font-weight:400;font-size:26px;margin:0}
  .sub{font-size:12px;opacity:.75;margin:2px 0 14px;letter-spacing:.04em}
  .tabs{display:flex;gap:6px}
  .tab{flex:1;padding:11px 4px;text-align:center;border-radius:10px 10px 0 0;background:rgba(255,255,255,.1);font-weight:500;font-size:13px;line-height:1.2;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .grupo{margin:4px 0 14px}.grupoTit{display:flex;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--linea);margin-bottom:10px;cursor:pointer}
  .grupoTit .t{font-family:'Yeseva One',serif;color:var(--cafe);font-size:18px;flex:1}.grupoTit .n{font-size:12px;color:var(--suave)}
  .grupoTit .fl{color:var(--cafe);transition:transform .2s}.grupo.cerrado .fl{transform:rotate(-90deg)}.grupo.cerrado .cuerpo{display:none}
  .mini{background:none;border:1px dashed var(--linea);color:var(--cafe);border-radius:10px;padding:10px;width:100%;font:500 14px Montserrat;cursor:pointer}
  .quitar{background:none;border:none;color:var(--suave);font-size:12px;text-decoration:underline;padding:4px 0 10px;cursor:pointer}
  .tab.on{background:var(--crema);color:var(--cafe)}
  main{padding:14px 16px 40px}
  .resumen{font-size:13px;color:var(--suave);margin:0 0 12px}
  .card{cursor:pointer;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
  .hora{font-family:'Yeseva One',serif;font-size:20px;color:var(--cafe);min-width:62px}
  .info{flex:1;min-width:0}
  .nombre{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ninosTxt{font-size:13px;color:var(--cafe);margin-top:3px;line-height:1.35}
  .cont{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:10px}
  .cont .fila3{display:flex;gap:8px;margin-top:10px}.cont .fila3 .btn{margin:0;padding:11px;font-size:14px}
  .cont .dato{font-size:14px;line-height:1.6}.cont .dato b{color:var(--cafe)}
  #badgeCont{background:#c08a4e;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:2px}
  #badgeCont:empty{display:none}
  .resumenCaja{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
  .kpi{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px}
  .kpi .v{font-family:'Yeseva One',serif;color:var(--cafe);font-size:20px}.kpi .l{font-size:11px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .libre{color:var(--suave);font-style:italic}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--beige)}
  .chip.ok{background:#e3ece3;color:var(--ok)} .chip.pend{background:#f6e8d6;color:var(--pend)}
  .card.vacio{background:transparent;border-style:dashed}
  .flecha{color:var(--suave);font-size:20px}
  .panel{position:fixed;inset:0;background:var(--crema);z-index:10;overflow:auto;display:none;padding:18px 16px 40px}
  .panel.on{display:block}
  .volver{background:none;border:none;color:var(--cafe);font:500 15px Montserrat;padding:0;margin-bottom:14px}
  h2{font-family:'Yeseva One',serif;font-weight:400;color:var(--cafe);font-size:22px;margin:0 0 4px}
  label{display:block;font-size:12px;font-weight:600;color:var(--suave);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
  input,select,textarea{width:100%;padding:13px;border:1px solid var(--linea);border-radius:10px;font:15px Montserrat;background:#fff;color:var(--texto)}
  textarea{min-height:90px}
  #msg{min-height:300px;font-size:14px;line-height:1.5}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font:600 15px Montserrat;margin-top:12px;text-align:center;text-decoration:none}
  .prim{background:var(--cafe);color:var(--crema)} .wa{background:#25D366;color:#fff}
  .sec{background:#fff;color:var(--cafe);border:1px solid var(--linea)} .peligro{background:#fff;color:var(--rojo);border:1px solid #e8c9c6}
  .datos{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px;margin-top:12px;font-size:14px;line-height:1.7}
  .datos b{color:var(--cafe)}
  .fila2{display:flex;gap:10px}.fila2>div{flex:1}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .toast{position:fixed;left:16px;right:16px;bottom:20px;background:var(--cafe);color:var(--crema);padding:14px;border-radius:12px;text-align:center;z-index:20;display:none}
  .cargando{text-align:center;color:var(--suave);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>Reservas Navidad</h1>
  <div class="sub">PICABÚ FOTOGRAFÍA</div>
  <div class="tabs">
    <div class="tab on" data-f="2026-11-28" onclick="elegirDia(this)">Sábado 28</div>
    <div class="tab" data-f="2026-11-29" onclick="elegirDia(this)">Domingo 29</div>
    <div class="tab" data-f="extras" onclick="elegirDia(this)">Fechas extras</div>
    <div class="tab" data-f="contable" onclick="elegirDia(this)">Contable <span id="badgeCont"></span></div>
  </div>
</header>
<main id="lista"><div class="cargando">Cargando turnos…</div></main>

<div class="panel" id="pExtra">
  <button class="volver" onclick="cerrar()">← Volver</button>
  <h2>Agregar turno extra</h2>
  <label>Fecha</label><input id="xFecha" type="date" min="2026-10-01">
  <label>Horario</label><input id="xHora" type="time" step="900" value="16:00">
  <button class="btn prim" id="xGuardar" onclick="agregarExtra()">Agregar horario</button>
</div>

<div class="panel" id="pReserva">
  <button class="volver" onclick="cerrar()">← Volver</button>
  <h2 id="rTitulo"></h2>
  <label>Nombre o usuario de Instagram</label><input id="rNombre">
  <label>WhatsApp</label><input id="rWa" type="tel" placeholder="11 3833 1475">
  <div class="fila2">
    <div><label>Precio</label><select id="rTipo"><option value="Preventa">Preventa $180.000</option><option value="Regular">Regular $230.000</option></select></div>
    <div><label>Seña recibida</label><input id="rSena" type="number" inputmode="numeric" value="80000"></div>
  </div>
  <label>Notas (opcional)</label><textarea id="rNotas"></textarea>
  <button class="btn prim" id="rGuardar" onclick="guardar()">Reservar turno</button>
</div>

<div class="panel" id="pDetalle">
  <button class="volver" onclick="cerrar()">← Volver</button>
  <h2 id="dNombre"></h2>
  <div id="dTurno" class="resumen"></div>
  <div class="datos" id="dDatos"></div>
  <label>Nombre de la clienta</label><input id="eNombre">
  <label>Niños (nombre y edad)</label><textarea id="eNinos" style="min-height:60px"></textarea>
  <label>Email</label><input id="eEmail" type="email">
  <label>Notas</label><textarea id="eNotas" style="min-height:60px"></textarea>
  <button class="btn sec" id="btnGuardarDatos" onclick="guardarDatosFicha()">Guardar cambios</button>
  <label>Mensaje de confirmación</label>
  <textarea id="msg"></textarea>
  <button class="btn sec" onclick="copiar()">Copiar mensaje</button>
  <a class="btn wa" id="btnWa" target="_blank" onclick="enviado()">Abrir WhatsApp de la clienta</a>
  <button class="btn sec" id="btnNoEnv" style="display:none" onclick="noEnviado()">Marcar WhatsApp como NO enviado</button>
  <button class="btn sec" style="margin-top:28px" onclick="verMover()">Mover a otro horario</button>
  <div id="dMover" style="display:none"><label>Elegí el nuevo horario</label><div class="slots" id="dSlots"></div></div>
  <button class="btn peligro" id="btnCancel" onclick="cancelarTurno()">Cancelar turno</button>
</div>

<div class="toast" id="toast"></div>
<div id="guardandoBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:30;background:#c08a4e;color:#fff;text-align:center;font:600 13px Montserrat,sans-serif;padding:6px">Guardando…</div>

<script>
const CLAVE = new URLSearchParams(location.search).get('k') || '';
const API = 'https://script.google.com/macros/s/AKfycbxsVHSmHlWQd5K781Nx4sPPzgWkM8i7iOJ0HdrNn1XAN4AZJh4xA1net9oCrgAuA7qEjw/exec';
function run(){
  let ok = () => {}, fail = error;
  let px;
  const r = {
    withSuccessHandler(f){ ok = f; return px; },
    withFailureHandler(f){ fail = f; return px; }
  };
  return px = new Proxy(r, { get(t, fn){
    if (fn in t) return t[fn];
    return (...args) => {
      if (window.google && google.script && google.script.run)
        return google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args);
      fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', keepalive: fn !== 'getTurnos', body: JSON.stringify({ k: args[0], fn: fn, args: args.slice(1) }) })
        .then(x => x.json()).then(j => j.ok ? ok(j.data) : fail(new Error(j.error))).catch(fail);
    };
  }});
}
let turnos = [], dia = '2026-11-28', actual = null, cancelArmado = false, plantilla = '', formLink = '', guiaLink = '', pendientes = 0;
const PRECIOS = { Preventa: 180000, Regular: 230000 };

function cargar(despues){
  run().withSuccessHandler(r => {
    if (pendientes > 0) return;
    if (Array.isArray(r)) turnos = r; else { turnos = r.turnos; plantilla = r.plantilla; formLink = r.form; guiaLink = r.guia; }
    pintar();
    if (actual && document.getElementById('pDetalle').classList.contains('on')) { const a = buscar(actual.fila); if (a && a.estado === 'Reservado') { actual = a; refrescarFicha(); } }
    if (despues) despues();
  }).withFailureHandler(error).getTurnos(CLAVE);
}
function guardando(n){
  pendientes += n;
  document.getElementById('guardandoBar').style.display = pendientes > 0 ? 'block' : 'none';
  if (pendientes === 0) cargar();
}

function elegirDia(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on'); dia = el.dataset.f; pintar();
}
// ---- registro contable ----
function nombresNinos(t){
  return String(t || '').split(/\n|,|;|\sy\s|\s-\s/).map(x => x
    .replace(/\(.*?\)/g, '').replace(/\d+[.,]?\d*\s*(años|año|anios|meses|mes|m|a|días|dias|semanas)?\b\.?/gi, '')
    .replace(/\s+/g, ' ').trim().replace(/\s+(de|con|tiene)$/i, '')).filter(Boolean).join(', ');
}
function clienteCont(t){ const n = nombresNinos(t.ninos); return t.clienta + (n ? ' / ' + n : ''); }
function codigoCont(t){ return t.precio === 180000 ? 'Navidad-PREV' : 'Navidad'; }
function filaCont(t){ return [t.fventa || '', clienteCont(t), codigoCont(t)].join('\t'); }
function pendientesCont(){ return turnos.filter(t => t.estado === 'Reservado' && t.reg !== 'Sí'); }
function numero(s){ return Number(String(s || '').replace(/\D/g, '')) || 0; }
function resumenVentas(){
  const v = turnos.filter(t => t.estado === 'Reservado');
  const total = v.reduce((a, t) => a + (t.precio || 0), 0);
  const pend = v.reduce((a, t) => a + numero(t.saldo), 0);
  return `<div class="resumenCaja">
    <div class="kpi"><div class="v">${v.length}</div><div class="l">Sesiones vendidas</div></div>
    <div class="kpi"><div class="v">${pesos(total)}</div><div class="l">Total ventas</div></div>
    <div class="kpi"><div class="v">${pesos(total - pend)}</div><div class="l">Cobrado (señas)</div></div>
    <div class="kpi"><div class="v">${pesos(pend)}</div><div class="l">Pendiente en efectivo</div></div></div>`;
}
function pintarContable(){
  const p = pendientesCont();
  let h = resumenVentas() + (p.length ? `<p class="resumen">${p.length} para pasar al registro contable · pegalas en la columna <b>Fecha</b> (C) de la pestaña Ventas</p>
    <button class="btn prim" style="margin:0 0 14px" onclick="copiarCont()">Copiar todas (${p.length})</button>`
    : '<p class="resumen" style="text-align:center;padding:30px 0">✓ Todo registrado</p>');
  p.forEach(t => {
    h += `<div class="cont"><div class="dato"><b>${esc(t.fventa || 'sin fecha')}</b> · ${esc(clienteCont(t))}<br><span style="color:var(--suave)">${codigoCont(t)} · turno ${esc(t.dia.split(' ')[0])} ${t.hora}</span></div>
      <div class="fila3"><button class="btn sec" onclick="copiarCont(${t.fila})">Copiar</button>
      <button class="btn prim" onclick="registrar(${t.fila})">✓ Registrado</button></div></div>`;
  });
  document.getElementById('lista').innerHTML = h;
}
function copiarCont(f){
  const filas = f ? [buscar(f)] : pendientesCont();
  const txt = filas.map(filaCont).join('\n');
  const ok = () => aviso(filas.length > 1 ? filas.length + ' filas copiadas ✓' : 'Fila copiada ✓');
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok).catch(() => copiaVieja(txt, ok)); else copiaVieja(txt, ok);
}
function copiaVieja(txt, ok){ const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); ok(); }
function registrar(f){
  const t = buscar(f); t.reg = 'Sí'; pintar(); aviso('Marcada como registrada ✓'); guardando(1);
  run().withSuccessHandler(() => guardando(-1)).withFailureHandler(e => { t.reg = 'No'; pintar(); error(e); guardando(-1); }).marcarRegistrado(CLAVE, f, 'Sí');
}

// ---- fechas extras ----
const DIAS_EVENTO = ['2026-11-28', '2026-11-29'];
let cerrados = {};
try { cerrados = JSON.parse(localStorage.getItem('picabuCerrados') || '{}'); } catch (e) {}
function esExtra(t){ return !DIAS_EVENTO.includes(t.fecha); }
function pintarExtras(){
  const ext = turnos.filter(t => esExtra(t) && t.estado !== 'Eliminado');
  const fechas = [...new Set(ext.map(t => t.fecha))].sort();
  let h = fechas.length ? '' : '<p class="resumen" style="text-align:center;padding:24px 0 8px">Todavía no hay fechas extras</p>';
  fechas.forEach(f => {
    const del = ext.filter(t => t.fecha === f).sort((a, b) => a.hora.localeCompare(b.hora));
    const res = del.filter(t => t.estado === 'Reservado').length;
    h += `<div class="grupo${cerrados[f] ? ' cerrado' : ''}"><div class="grupoTit" onclick="plegar('${f}')"><span class="fl">▾</span><span class="t">${esc(del[0].dia)}</span>
      <span class="n">${res} reservados · ${del.length - res} libres</span></div><div class="cuerpo">`;
    del.forEach(t => { h += tarjeta(t); if (t.estado === 'Libre') h += `<button class="quitar" onclick="quitarExtra(${t.fila})">Quitar este horario</button>`; });
    h += `<button class="mini" onclick="abrirExtra('${f}')">+ Agregar horario este día</button></div></div>`;
  });
  h += `<button class="btn prim" style="margin-top:6px" onclick="abrirExtra('')">+ Agregar otra fecha</button>`;
  document.getElementById('lista').innerHTML = h;
}
function plegar(f){ cerrados[f] = !cerrados[f]; try { localStorage.setItem('picabuCerrados', JSON.stringify(cerrados)); } catch (e) {} pintar(); }
function abrirExtra(f){ document.getElementById('xFecha').value = f; abrir('pExtra'); }
function agregarExtra(){
  const f = val('xFecha'), h = val('xHora');
  if (!f || !h) return aviso('Elegí fecha y horario');
  if (DIAS_EVENTO.includes(f)) return aviso('Esa fecha ya tiene su propia solapa');
  if (turnos.some(t => t.fecha === f && t.hora === h && t.estado !== 'Eliminado')) return aviso('Ese horario ya existe');
  const b = document.getElementById('xGuardar'); b.disabled = true; b.textContent = 'Agregando…';
  run().withSuccessHandler(() => { b.disabled = false; b.textContent = 'Agregar horario'; cerrados[f] = false; cerrar(); aviso('Horario agregado ✓'); cargar(); })
    .withFailureHandler(e => { b.disabled = false; b.textContent = 'Agregar horario'; error(e); }).agregarTurno(CLAVE, f, h);
}
function quitarExtra(f){
  const t = buscar(f); t.estado = 'Eliminado'; pintar(); aviso('Horario quitado'); guardando(1);
  run().withSuccessHandler(() => guardando(-1)).withFailureHandler(e => { t.estado = 'Libre'; pintar(); error(e); guardando(-1); }).quitarTurno(CLAVE, f);
}
function tarjeta(t){
  if (t.estado === 'Reservado') {
    return `<div class="card" onclick="abrirDetalle(${t.fila})"><div class="hora">${t.hora}</div><div class="info">
        <div class="nombre">${esc(t.clienta)}</div>
        ${t.ninos ? `<div class="ninosTxt">${esc(t.ninos)}</div>` : ''}
        <div class="chips"><span class="chip ${t.conf==='Sí'?'ok':'pend'}">${t.conf==='Sí'?'✓ WhatsApp enviado':'Falta enviar WhatsApp'}</span>
        <span class="chip ${t.form==='Sí'?'ok':'pend'}">${t.form==='Sí'?'✓ Formulario':'Falta formulario'}</span>
        <span class="chip">Saldo ${t.saldo}</span></div></div><div class="flecha">›</div></div>`;
  }
  return `<div class="card vacio" onclick="abrirReserva(${t.fila})"><div class="hora">${t.hora}</div><div class="info libre">Libre · tocá para reservar</div><div class="flecha">+</div></div>`;
}

function pintar(){
  const nC = pendientesCont().length; document.getElementById('badgeCont').textContent = nC ? nC : '';
  if (dia === 'contable') return pintarContable();
  if (dia === 'extras') return pintarExtras();
  const del = turnos.filter(t => t.fecha === dia);
  const res = del.filter(t => t.estado === 'Reservado');
  let h = `<p class="resumen">${res.length} reservados · ${del.length - res.length} libres</p>`;
  del.forEach(t => { h += tarjeta(t); });
  document.getElementById('lista').innerHTML = h;
}
function buscar(f){ return turnos.find(t => t.fila === f); }

// ---- mensaje armado en el momento, sin esperar al servidor ----
function pesos(n){ return '$' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function horaCorta(h){ h = String(h); return h.endsWith(':00') ? h.slice(0, -3) : h; }
function waIntl(s){ let d = String(s || '').replace(/\D/g, '').replace(/^0+/, ''); if (d.startsWith('54')) return d; if (d.length === 10) return '549' + d; return d; }
function mensaje(t){
  return (plantilla || '').replace(/{DIA}/g, t.dia).replace(/{HORA}/g, horaCorta(t.hora)).replace(/{SALDO}/g, t.saldo)
    .replace(/{FORM}/g, formLink).replace(/{GUIA}/g, guiaLink).replace(/{NOMBRE}/g, String(t.clienta || '').split(' ')[0]);
}
function setWa(t){
  const txt = encodeURIComponent(mensaje(t)), tel = waIntl(t.wa);
  const b = document.getElementById('btnWa');
  if (/iPhone|iPad|Android/i.test(navigator.userAgent)) { b.href = 'https://wa.me/' + tel + '?text=' + txt; b.target = '_blank'; }
  else { b.href = 'https://web.whatsapp.com/send?phone=' + tel + '&text=' + txt; b.target = 'whatsapp'; }
}

function abrirReserva(f){
  actual = buscar(f);
  document.getElementById('rTitulo').textContent = actual.dia + ' · ' + actual.hora;
  ['rNombre','rWa','rNotas'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('rSena').value = 80000;
  document.getElementById('rTipo').value = 'Preventa';
  abrir('pReserva');
}
function guardar(){
  const d = { nombre: val('rNombre'), wa: val('rWa'), tipo: val('rTipo'), sena: val('rSena'), notas: val('rNotas') };
  if (!d.nombre || !d.wa) return aviso('Completá nombre y WhatsApp');
  const t = actual;
  if (t.estado !== 'Libre') return aviso('Ese turno ya está reservado');
  Object.assign(t, { estado: 'Reservado', clienta: d.nombre, wa: d.wa, saldo: pesos(PRECIOS[d.tipo] - (Number(d.sena) || 0)),
    conf: 'No', form: 'No', email: '', ninos: '', notas: d.notas, precio: PRECIOS[d.tipo], reg: 'No',
    fventa: new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'America/Argentina/Buenos_Aires' }) });
  pintar(); abrirDetalle(t.fila);
  guardando(1);
  run().withSuccessHandler(() => { aviso('Turno guardado ✓'); guardando(-1); })
    .withFailureHandler(e => { alert('⚠️ No se pudo guardar el turno de ' + d.nombre + '.\n' + (e.message || e) + '\n\nNo le mandes el mensaje todavía.'); cerrar(); guardando(-1); })
    .reservar(CLAVE, t.fila, d);
}

function abrirDetalle(f){
  actual = buscar(f); cancelArmado = false;
  document.getElementById('btnCancel').textContent = 'Cancelar turno';
  document.getElementById('dMover').style.display = 'none';
  refrescarFicha();
  abrir('pDetalle');
}
function refrescarFicha(){
  document.getElementById('dNombre').textContent = actual.clienta;
  document.getElementById('dTurno').textContent = actual.dia + ' · ' + actual.hora + ' hs';
  document.getElementById('dDatos').innerHTML =
    `<b>WhatsApp:</b> ${esc(actual.wa)}<br><b>Saldo en efectivo:</b> ${actual.saldo}<br>` +
    `<b>Formulario:</b> ${actual.form === 'Sí' ? '✓ completo' : 'falta completar'}`;
  ['eNombre','eNinos','eEmail','eNotas'].forEach(id => { const el = document.getElementById(id); if (document.activeElement !== el) el.value = actual[{eNombre:'clienta',eNinos:'ninos',eEmail:'email',eNotas:'notas'}[id]] || ''; });
  document.getElementById('msg').value = mensaje(actual);
  setWa(actual);
  document.getElementById('btnNoEnv').style.display = actual.conf === 'Sí' ? 'block' : 'none';
}
function guardarDatosFicha(){
  const d = { nombre: val('eNombre'), ninos: val('eNinos'), email: val('eEmail'), notas: val('eNotas') };
  if (!d.nombre) return aviso('El nombre no puede quedar vacío');
  Object.assign(actual, { clienta: d.nombre, ninos: d.ninos, email: d.email.toLowerCase(), notas: d.notas });
  pintar(); refrescarFicha(); guardando(1);
  run().withSuccessHandler(() => { aviso('Cambios guardados ✓'); guardando(-1); })
    .withFailureHandler(e => { alert('⚠️ No se pudieron guardar los cambios: ' + (e.message || e)); guardando(-1); })
    .guardarDatos(CLAVE, actual.fila, d);
}
function noEnviado(){
  actual.conf = 'No'; pintar(); refrescarFicha(); guardando(1);
  run().withSuccessHandler(() => guardando(-1)).withFailureHandler(e => { error(e); guardando(-1); }).marcarConfirmada(CLAVE, actual.fila, 'No');
}
function copiar(){
  const t = document.getElementById('msg');
  const ok = () => { aviso('Mensaje copiado ✓'); enviado(); };
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok).catch(() => { t.select(); document.execCommand('copy'); ok(); });
  else { t.select(); document.execCommand('copy'); ok(); }
}
function enviado(){
  if (!actual || actual.conf === 'Sí') return;
  actual.conf = 'Sí'; pintar(); document.getElementById('btnNoEnv').style.display = 'block'; guardando(1);
  run().withSuccessHandler(() => guardando(-1)).withFailureHandler(e => { error(e); guardando(-1); }).marcarConfirmada(CLAVE, actual.fila, 'Sí');
}
function verMover(){
  const libres = turnos.filter(t => t.estado === 'Libre').sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  document.getElementById('dSlots').innerHTML = libres.length ? libres.map(t =>
    `<button class="btn sec" style="margin:0" onclick="moverA(${t.fila})">${t.dia.split(' ')[0].slice(0,3)} ${t.dia.split(' ')[1] || ''} · ${t.hora}</button>`).join('') : '<p class="resumen">No hay turnos libres.</p>';
  document.getElementById('dMover').style.display = 'block';
}
function moverA(dest){
  const a = actual, b = buscar(dest);
  ['estado','clienta','wa','saldo','form','email','ninos','notas','precio','fventa','reg'].forEach(k => b[k] = a[k]);
  b.conf = 'No';
  Object.assign(a, { estado: 'Libre', clienta: '', wa: '', saldo: '', conf: '', form: '', email: '', ninos: '', notas: '', precio: 0, fventa: '', reg: '' });
  pintar(); abrirDetalle(dest); aviso('Turno movido ✓ · mandale el mensaje nuevo'); guardando(1);
  run().withSuccessHandler(() => guardando(-1)).withFailureHandler(e => { alert('⚠️ No se pudo mover el turno: ' + (e.message || e)); cerrar(); guardando(-1); }).mover(CLAVE, a.fila, dest);
}
function cancelarTurno(){
  const b = document.getElementById('btnCancel');
  if (!cancelArmado) { cancelArmado = true; b.textContent = 'Tocá de nuevo para confirmar la cancelación'; return; }
  const f = actual.fila;
  Object.assign(actual, { estado: 'Libre', clienta: '', wa: '', saldo: '', conf: '', form: '', email: '', ninos: '', notas: '', precio: 0, fventa: '', reg: '' });
  cerrar(); pintar(); aviso('Turno cancelado · quedó libre'); guardando(1);
  run().withSuccessHandler(() => guardando(-1)).withFailureHandler(e => { alert('⚠️ No se pudo cancelar: ' + (e.message || e)); guardando(-1); }).cancelar(CLAVE, f);
}

function abrir(id){ document.getElementById(id).classList.add('on'); window.scrollTo(0,0); }
function cerrar(){ document.querySelectorAll('.panel').forEach(p => p.classList.remove('on')); }
function val(id){ return document.getElementById(id).value.trim(); }
function esc(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function aviso(t){ const x = document.getElementById('toast'); x.textContent = t; x.style.display = 'block'; setTimeout(() => x.style.display = 'none', 2600); }
function error(e){ aviso('Ups: ' + (e && e.message ? e.message : e)); }
cargar();
</script>
</body>
</html>
